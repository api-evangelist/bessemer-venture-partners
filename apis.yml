name: Bessemer Venture Partners
description: >-
  Bessemer Venture Partners (BVP) is one of the oldest and largest venture
  capital firms in the world, founded in 1911 out of the fortune of steel
  magnate Henry Phipps and headquartered in San Francisco, California. With more
  than $20 billion in assets under management and investment teams in San
  Francisco, Silicon Valley, New York, Boston, London, Bangalore, and Tel Aviv,
  Bessemer invests globally across seed, early, and growth stages, and runs a
  dedicated private equity buyout arm, BVP Forge. The firm invests across
  artificial intelligence and machine learning, cloud and infrastructure,
  developer tools, cybersecurity, fintech, healthcare and biotech, consumer,
  marketplaces, vertical software, data, deep tech and defense, and crypto/web3.
  Bessemer has backed transformative companies including Shopify, Twilio,
  Pinterest, LinkedIn, Yelp, DocuSign, Wix, Fiverr, Toast, ServiceTitan,
  PagerDuty, Auth0, Box, and Canva, and is known for publishing its "Anti-
  Portfolio" of missed opportunities, its Atlas research roadmaps, and its
  cloud/state-of-the-industry benchmark reports. Investing out of its 12th
  early-stage fund (a $3.85B vehicle), Bessemer was ranked among the largest
  venture firms by five-year fundraising. This profile tracks Bessemer's
  identity and its portfolio graph across the API Evangelist network.
